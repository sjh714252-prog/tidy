name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # M15: real OCR test (tests/m15_ocr.rs). Windows uses its built-in
      # OCR; elsewhere the test is skipped when no engine is installed.
      - name: tesseract (OCR test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor poppler-utils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Tauri app: type-check + bundle the frontend, then fmt/clippy the
  # src-tauri crate (a separate workspace). Nothing is launched.
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - run: npm ci
      - run: npm run build
      - run: cargo fmt -- --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  # M16: the NAS agent image builds, starts and answers with its password.
  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/agent.Dockerfile -t tidy-agent:ci .
      - name: Smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/nas/업무 /tmp/nas-config
          docker run -d --name agent -p 7841:7841 -e TIDY_TOKEN=ci-password \
            -v /tmp/nas-config:/config -v /tmp/nas/업무:/data/업무 tidy-agent:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7841/api/v1/hello && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7841/api/v1/status)
          test "$code" = 401
          curl -fsS -H 'Authorization: Bearer ci-password' http://127.0.0.1:7841/api/v1/status | tee /tmp/status.json
          grep -q '"dataRoot":"/data"' /tmp/status.json
          docker exec agent tesseract --list-langs | grep -q kor
          docker logs agent

name: Release
# Installers for a version tag (v0.1.0 …): Windows .msi/.exe (NSIS),
# macOS .dmg, Linux .deb/.AppImage, attached to a draft GitHub release.
# Can also be run by hand (Actions → Release → Run workflow) to get the
# installers as workflow artifacts without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
            args: ""
            bin: src-tauri/target/release/tidy-desktop.exe
          - os: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
            bin: src-tauri/target/universal-apple-darwin/release/tidy-desktop
          # The oldest supported runner: AppImage/deb then run on older glibc too.
          - os: ubuntu-22.04
            bundles: deb,appimage
            args: ""
            bin: src-tauri/target/release/tidy-desktop
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux build deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            patchelf file
      - run: npm ci
      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}
      # The dev test bridge (src-tauri/src/devbridge.rs, HTTP on 127.0.0.1:1421)
      # is compiled only with debug_assertions. Fail the release if any trace
      # of it made it into the binary or the embedded frontend.
      - name: Release binary has no dev bridge
        shell: bash
        run: |
          set -euo pipefail
          for marker in "dev bridge" "tidy-devbridge" "127.0.0.1:1421"; do
            if LC_ALL=C grep -a -q -- "$marker" "${{ matrix.bin }}"; then
              echo "::error::release binary contains '$marker'"
              exit 1
            fi
          done
          echo "ok: no dev bridge in ${{ matrix.bin }}"
      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tidy-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Tidy ${{ github.ref_name }}
          files: |
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage

name: Release
# Installers: Windows .msi/.exe (NSIS), macOS .dmg, Linux .deb/.AppImage.
# - Pushing a version tag (v0.4.0 …) attaches them to a *draft* release.
# - Running it by hand on main (Actions → Release → Run workflow) makes a
#   *public* release (SPEC §14.6): the tag v<apps/desktop/package.json
#   version> is created here if missing (an existing release gets its files
#   replaced), and the notes list the PRs merged since the previous release.
# - Running it by hand on another branch only uploads workflow artifacts.
# - (M16) The NAS agent image: amd64 + arm64, pushed to
#   ghcr.io/<owner>/tidy-agent:<version> and :latest when there is a
#   release tag, and attached as tidy-agent_<version>_<arch>.tar.gz
#   (Synology Container Manager › 이미지 › 추가 › 파일에서 추가).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      public: ${{ steps.tag.outputs.public }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        name: Release tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "public=false" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
            v="v$(node -p "require('./apps/desktop/package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
              echo "tag $v exists: its release gets the new files"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "$v" "$GITHUB_SHA"
              # Pushed with GITHUB_TOKEN: this does not start another run.
              git push origin "refs/tags/$v"
            fi
            echo "tag=$v" >> "$GITHUB_OUTPUT"
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "public=false" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
            args: ""
            bin: src-tauri/target/release/tidy-desktop.exe
          - os: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
            bin: src-tauri/target/universal-apple-darwin/release/tidy-desktop
          # The oldest supported runner: AppImage/deb then run on older glibc too.
          - os: ubuntu-22.04
            bundles: deb,appimage
            args: ""
            bin: src-tauri/target/release/tidy-desktop
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux build deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            patchelf file
      - run: npm ci
      # "정보" shows the commit a build came from (about.rs, option_env!).
      - name: Build commit
        shell: bash
        run: echo "TIDY_GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}
      # The dev test bridge (src-tauri/src/devbridge.rs, HTTP on 127.0.0.1:1421)
      # is compiled only with debug_assertions. Fail the release if any trace
      # of it made it into the binary or the embedded frontend.
      - name: Release binary has no dev bridge
        shell: bash
        run: |
          set -euo pipefail
          for marker in "dev bridge" "tidy-devbridge" "127.0.0.1:1421"; do
            if LC_ALL=C grep -a -q -- "$marker" "${{ matrix.bin }}"; then
              echo "::error::release binary contains '$marker'"
              exit 1
            fi
          done
          echo "ok: no dev bridge in ${{ matrix.bin }}"
      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tidy-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Attach to release
        if: needs.prepare.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Tidy ${{ needs.prepare.outputs.tag }}
          # Tag push: draft (publish by hand). Run by hand on main: public.
          draft: ${{ needs.prepare.outputs.public != 'true' }}
          make_latest: ${{ needs.prepare.outputs.public == 'true' }}
          # Notes = PR titles merged since the previous release.
          generate_release_notes: true
          overwrite_files: true
          files: |
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage

  agent:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Names
        id: n
        run: |
          set -euo pipefail
          v="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tidy-agent" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          docker build -f docker/agent.Dockerfile \
            --label org.opencontainers.image.version=${{ steps.n.outputs.version }} \
            -t ${{ steps.n.outputs.image }}:${{ steps.n.outputs.version }}-${{ matrix.arch }} .
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name agent -p 7841:7841 -e TIDY_TOKEN=release-check \
            ${{ steps.n.outputs.image }}:${{ steps.n.outputs.version }}-${{ matrix.arch }}
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7841/api/v1/hello && break; sleep 1; done
          curl -fsS -H 'Authorization: Bearer release-check' http://127.0.0.1:7841/api/v1/status
          docker rm -f agent
      - name: Image file
        run: |
          set -euo pipefail
          mkdir -p out
          docker save ${{ steps.n.outputs.image }}:${{ steps.n.outputs.version }}-${{ matrix.arch }} \
            | gzip -9 > out/tidy-agent_${{ steps.n.outputs.version }}_${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tidy-agent-${{ matrix.arch }}
          path: out/*.tar.gz
          if-no-files-found: error
      - name: Push (per arch)
        if: needs.prepare.outputs.tag != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ${{ steps.n.outputs.image }}:${{ steps.n.outputs.version }}-${{ matrix.arch }}
      - name: Attach to release
        if: needs.prepare.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Tidy ${{ needs.prepare.outputs.tag }}
          draft: ${{ needs.prepare.outputs.public != 'true' }}
          make_latest: ${{ needs.prepare.outputs.public == 'true' }}
          generate_release_notes: true
          overwrite_files: true
          files: out/*.tar.gz

  # One multi-arch name for both: :<version> and (public release) :latest.
  agent-manifest:
    needs: [prepare, agent]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest
        run: |
          set -euo pipefail
          v="$(node -p "require('./apps/desktop/package.json').version")"
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tidy-agent"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags="-t $img:$v"
          if [ "${{ needs.prepare.outputs.public }}" = true ]; then tags="$tags -t $img:latest"; fi
          docker buildx imagetools create $tags "$img:$v-amd64" "$img:$v-arm64"
          docker buildx imagetools inspect "$img:$v"

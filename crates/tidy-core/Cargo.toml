[package]
name = "tidy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for Tidy: scanning, classification, moving, indexing and search"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
walkdir.workspace = true
humansize.workspace = true
chrono.workspace = true
dirs.workspace = true
notify.workspace = true
rusqlite.workspace = true
regex.workspace = true
globset.workspace = true
blake3.workspace = true
sha2.workspace = true
uuid.workspace = true
trash.workspace = true
dunce.workspace = true
reqwest.workspace = true
tokio.workspace = true
async-trait.workspace = true
keyring.workspace = true
zeroize = "1"
# M2 extractors (SPEC §5.5): pure-Rust, no external CLIs.
# M9 vault: ZIP + AES-256 (WinZip AE-2) via aes-crypto.
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto"] }
quick-xml = "0.41"
calamine = { version = "0.36", features = ["dates"] }
pdf-extract = "0.12"
encoding_rs = "0.8"
# M14 hwp (HWP 5.0 OLE compound file + raw-deflate records) and hard-link
# detection for duplicate groups.
cfb = "0.10"
flate2 = "1"
same-file = "1"
# M16 vision: decode / turn upright / shrink pictures before sending them
# (pure Rust codecs), base64 for the request body.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
base64 = "0.22"
# M16 NAS agent (`tidy serve`): small blocking HTTP server.
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
# M6: GetDriveTypeW (is this drive letter a network share?).
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }
# M15: built-in OCR (Windows.Media.Ocr) + PDF page rendering (Windows.Data.Pdf).
# Same version `trash` already pulls in.
windows = { version = "0.62", features = [
  "Data_Pdf",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_System_WinRT",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[package]
name = "tidy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for Tidy: scanning, classification, moving, indexing and search"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
walkdir.workspace = true
humansize.workspace = true
chrono.workspace = true
dirs.workspace = true
notify.workspace = true
rusqlite.workspace = true
regex.workspace = true
globset.workspace = true
blake3.workspace = true
uuid.workspace = true
trash.workspace = true
dunce.workspace = true
reqwest.workspace = true
tokio.workspace = true
async-trait.workspace = true
keyring.workspace = true
# M2 extractors (SPEC §5.5): pure-Rust, no external CLIs.
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
calamine = { version = "0.36", features = ["dates"] }
pdf-extract = "0.12"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
# M6: GetDriveTypeW (is this drive letter a network share?).
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

# Tidy 설정 예시 (SPEC §7). 복사해서 config.toml로 사용하세요:
#   cp config.example.toml config.toml      (Windows: copy config.example.toml config.toml)
#   tidy watch --config config.toml
#
# 경로 작성 팁
# - "~"는 홈 폴더로 바뀝니다 (예: "~/Desktop" → C:\Users\<이름>\Desktop).
# - Windows 경로는 슬래시(/)로 쓰거나 작은따옴표 문자열을 쓰세요.
#   'C:\Users\홍 길동\OneDrive\바탕 화면'   ← 작은따옴표: 역슬래시 그대로
#   "C:/Users/홍 길동/OneDrive/바탕 화면"   ← 큰따옴표: 슬래시 사용
#   (큰따옴표 안의 역슬래시는 TOML 이스케이프로 해석되어 오류가 납니다.)
# - OneDrive 백업을 켠 한국어 Windows의 바탕화면은 보통
#   C:\Users\<이름>\OneDrive\바탕 화면 입니다. 실제 위치를 확인하세요.

[general]
language = "ko"
# onboarded = true       # 첫 실행 마법사를 마쳤는지(M8). 앱이 씁니다.
start_on_login = true    # 로그인 시 트레이로 자동 시작 (설치판). 앱 설정에서도 바꿀 수 있습니다.

[[watch]]
path = "~/Desktop"
kind = "local"
recursive = false        # 하위 폴더까지 감시하려면 true

[[watch]]
path = "~/Downloads"
kind = "local"
recursive = false
# 정리 방식(M8): "in_place"(기본) = 이 폴더 안에 하위 폴더를 만들어 정리,
# "collect" = organize_root 아래로 모으기. 규칙의 상대 경로 목적지와 {root}가 이 기준을 따릅니다.
# mode = "collect"
# organize_root = 'D:\정리' 

# NAS·공유 폴더(M6). kind = "network"이면:
#   - OS 변경 알림에 더해 poll_interval_s(기본 120초, 최소 5초)마다 폴더 목록을 비교합니다.
#   - 연결이 끊기면 이 폴더만 일시정지하고 60초마다 다시 확인합니다. 다시 연결되면 끊긴 동안
#     생긴 파일도 처리합니다.
#   - 다른 볼륨으로 옮길 때는 복사 → 크기·해시 검증 → 원본 정리 순서로 옮깁니다.
#   - 검색 인덱스는 기본으로 메타데이터만(본문 X). 해시는 작은 파일만([index] 참고).
# [[watch]]
# path = "Z:/공유/스캔"          # 또는 '\\nas\공유\스캔', "/Volumes/nas/스캔"
# kind = "network"
# recursive = true
# poll_interval_s = 120
# poll_only = false              # 변경 알림이 안 오는(또는 엉뚱한) NAS면 true: 폴링만
# index_content = false          # true면 본문도 인덱싱
# content_index_window = "02:00-05:00"   # 본문 인덱싱은 이 시간대에만(백그라운드). 수동 `tidy index`는 언제나

[classify]
# 규칙 파일. 상대 경로는 이 config.toml이 있는 폴더 기준입니다.
rules = "rules.toml"
# 파일 크기/수정시각이 이 시간(초) 동안 변하지 않아야 처리합니다(다운로드 중 파일 보호).
stabilize_secs = 3
ignore_globs = ["*.tmp", "*.crdownload", "*.part", "~$*", ".DS_Store", "Thumbs.db", "desktop.ini"]

[mover]
undo_retention_days = 30   # move_log 보관 기간(일). 지나면 로그만 지워지고 파일은 그대로.
# 목적지에 '내용이 같은' 파일이 이미 있을 때:
#   skip    = 옮기지 않고 그대로 둠 (기본)
#   rename  = "이름 (1).ext"로 옮김
#   replace = 기존 사본을 OS 휴지통으로 보내고 옮김 (영구 삭제 아님)
# 이름만 같고 내용이 다르면 항상 "이름 (1).ext"로 옮깁니다(덮어쓰기 없음).
duplicate_policy = "skip"
# NAS로/에서 동시에 복사·본문 읽기를 몇 개까지 할지(SPEC §5.9).
nas_concurrency = 2

[store]
# 이동 로그·검색 인덱스 DB(SQLite). 생략하면 OS 기본 위치:
#   Windows: %LOCALAPPDATA%\tidy\tidy.db / macOS: ~/Library/Application Support/tidy/tidy.db
#   Linux: ~/.local/share/tidy/tidy.db
# 상대 경로는 이 config.toml이 있는 폴더 기준입니다.
#
# ★ DB는 반드시 로컬 디스크에 두세요. NAS·공유 폴더·네트워크 드라이브(Z:, \\nas\..., 마운트된
#   공유) 위에 두면 SQLite가 파일 잠금을 얻지 못해 "disk I/O error"로 즉시 실패합니다.
#   감시 폴더가 NAS여도 DB만은 로컬 경로(또는 생략해서 기본 위치)로 지정하세요.
# path = "tidy.db"

[index]
# 본문 인덱싱 대상 최대 크기(MB). 이보다 큰 파일은 메타데이터(이름·크기·날짜)만 인덱싱합니다.
max_content_size_mb = 200
# 파일당 저장하는 본문 최대 글자 수. 넘는 부분은 검색 대상에서 잘립니다.
max_text_chars = 1000000
# 네트워크 폴더에서는 이 크기(MB)보다 작은 파일만 해시합니다(중복 찾기·재분류 방지에 사용).
max_hash_size_mb_network = 20

[ai]
# AI 분류(선택). 규칙에 맞지 않는 파일만 AI에 물어봅니다. 꺼져 있거나 키가 없거나
# 오프라인이어도 규칙 + 검색은 그대로 동작합니다.
enabled = false
active_profile = "home"
# 확신도가 이 값 이상이고, 목적지가 ai_auto = true 규칙의 폴더 안일 때만 묻지 않고 옮깁니다.
# 그 외에는 확인 팝업(대기열)으로 묻습니다.
auto_threshold = 0.9
# 본문 앞부분(content_chars 글자)을 AI에 보낼지. false면 파일명·크기·날짜·폴더만 보냅니다.
send_content = true
content_chars = 1500
timeout_secs = 20        # 한 파일당 최대 대기(재시도 포함). 넘으면 규칙만으로 처리합니다.
# 연속으로 이만큼 실패하면 'AI 사용 불가'로 두고 규칙만 씁니다. 1분 뒤부터 다시 확인해
# 응답하면 '사용'으로 돌아오고, 그동안 건너뛴 파일을 다시 AI에 보냅니다.
unavailable_after = 3

# API 키는 이 파일에 쓰지 않습니다. OS 키체인에만 저장합니다:
#   tidy ai key set tidy/anthropic      (입력은 화면에 표시되지 않음)
# 또는 앱의 설정 > AI 분류 > API 키. 상태 확인: tidy ai status / 시험: tidy ai test <파일>
#
# embed = 의미검색용 임베딩 모델(선택). Anthropic에는 임베딩 API가 없으므로 Ollama(로컬) 또는
# OpenAI 호환을 씁니다. 없으면 검색은 단어(FTS)로만 동작합니다.
[ai.profiles.home]
classify = { provider = "anthropic", model = "claude-haiku-5-5", key_ref = "tidy/anthropic", effort = "low" }
embed    = { provider = "ollama", model = "nomic-embed-text", base_url = "http://localhost:11434" }

# 회사 PC 등: 로컬 모델만, 본문은 보내지 않음 (임베딩도 파일명만)
[ai.profiles.work]
classify = { provider = "ollama", model = "qwen3:8b", base_url = "http://localhost:11434" }
embed    = { provider = "ollama", model = "nomic-embed-text", base_url = "http://localhost:11434" }
send_content = false

# OpenAI 호환 서버 예시
# [ai.profiles.openai]
# classify = { provider = "openai", model = "<모델 이름>", key_ref = "tidy/openai", base_url = "https://api.openai.com/v1" }
# embed    = { provider = "openai", model = "text-embedding-3-small", key_ref = "tidy/openai", base_url = "https://api.openai.com/v1" }

[search]
# 의미검색: [ai] enabled + 활성 프로필의 embed 모델이 있을 때. 파일명 + 본문 앞부분을 벡터로
# 저장해 두고(tidy index / tidy embed / 앱·watch 백그라운드) 단어 검색 결과와 합칩니다.
semantic = true
query_timeout_ms = 1500  # 질의 임베딩이 이보다 늦으면 그 검색은 단어 결과만
min_similarity = 0.3     # 뜻으로만 찾은 결과의 최소 유사도(모델마다 다름, 결과가 너무 많으면 올리기)
embed_chars = 1000       # 파일명 뒤에 붙여 임베딩하는 본문 글자 수

[report]
# 재구성(규칙/AI 정리 제안)이 절대 건드리지 않는 폴더. 앱에서는 요청마다 더 추가할 수 있습니다.
protected = []           # 예: ['C:\Users\나\바탕 화면\진행 중']
stale_days = 90          # 이 기간 동안 안 쓴 파일을 '오래 안 쓴 파일'로 표시
# scan_depth = 3         # 아주 큰 폴더: 이 깊이까지만 스캔 (`tidy report --scan-depth N`이 우선)

[security]
# 개인정보 탐지 + 암호화 보관 (M9, SPEC §14.2). 비밀번호는 여기 쓰지 않습니다 — 설정 화면이나
# `tidy vault password`로 정하면 OS 키체인(tidy/vault)에만 저장됩니다.
mode = "rules"           # "rules": 규칙의 encrypt 옵션만 | "vault": 개인정보면 vault_dir로 먼저(암호화)
# vault_dir = 'D:\정리\보안'
approval = "confirm"     # "confirm": 확인 팝업에서 승인 | "auto": 묻지 않고 암호화 (비밀번호가 없으면 항상 확인)

[security.pii]
enabled = true
rrn = true               # 주민등록번호 (검증 자릿수까지)
account = true           # 계좌번호 (근처에 계좌·입금·예금주 또는 은행명)
name_phone = true        # 같은 줄/행에 이름 + 휴대전화
name_email = true        # 같은 줄/행에 이름 + 이메일
# min_name_phone = 3     # 항목별 "이 건수 이상이면 개인정보" (기본 1)
exclude = ["^010-?0000-?0000$"]   # 세지 않을 값(정규식): 테스트 번호, 회사 대표 계좌 …
ai_check = false         # AI가 켜져 있으면 정규식 양성을 한 번 더 확인 (숫자·메일 아이디는 가려서 보냄)

# (M10) 업무 맥락 정리 — 고객사/날짜_이슈/종류로 묶기. AI(분류용 프로필) 필요.
# 리포트의 "업무 맥락으로 정리"(tidy curate scan)는 enabled와 상관없이 쓸 수 있고,
# enabled는 감시 중 새 파일에도 적용할지 정한다.
[curate]
enabled = false
prefer = false                 # true: 규칙보다 먼저 맥락으로 정리
context = "context.toml"       # 맥락 사전 (이 설정 파일 기준 상대 경로) — tidy context list
template = "{entity}/{yyyymmdd}_{issue}/{doc_kind}"   # 바다정보/20261020_과금이슈/로그
other_template = "기타/{topic}"                       # 기타/정책/문자 정책
min_confidence = 0.6           # 미만은 미분류(그대로 둠)
merge_days = 14                # 같은 고객사·이슈는 14일 안이면 가장 이른 날짜 폴더로
# batch_size = 30              # 한 번에 AI에 묻는 파일 수
# excerpt_chars = 400          # 파일당 본문 앞부분 (ai.send_content = true일 때만 보냄)

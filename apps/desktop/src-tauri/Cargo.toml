[package]
name = "tidy-desktop"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "Tidy desktop app (Tauri 2): tray, search window, confirm popup, queue, settings"

# Standalone workspace (see root Cargo.toml `exclude`).
[workspace]

[lib]
name = "tidy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tidy-core = { path = "../../../crates/tidy-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dunce = "1"
dirs = "6"
# Dev-only test bridge (src/devbridge.rs, cfg(debug_assertions)).
tiny_http = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

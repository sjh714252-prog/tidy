[workspace]
resolver = "2"
members = ["crates/tidy-core", "crates/tidy-cli"]
# The Tauri app needs GUI system libraries (WebView2 / webkit2gtk), so it is
# its own workspace: `cargo test --workspace` and CI stay headless.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sjh714252-prog/tidy"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
humansize = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tempfile = "3"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
globset = "0.4"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
trash = "5"
dunce = "1"
# M4 AI layer: async providers over HTTPS (rustls/ring: no OpenSSL, no cmake on Windows).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "net", "io-util", "sync"] }
async-trait = "0.1"
# API keys live only in the OS keychain (CLAUDE.md rule 5).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

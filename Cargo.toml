[workspace]
resolver = "2"
members = ["crates/tidy-core", "crates/tidy-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sjh714252-prog/tidy"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
humansize = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tempfile = "3"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
globset = "0.4"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
trash = "5"
dunce = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
